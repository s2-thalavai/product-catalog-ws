# Production template: app only, managed PostgreSQL, NGINX ingress with TLS, more replicas.
# Before first use, replace every CHANGE_ME and create the secrets listed in HOW_TO_RUN.md
# (they are deliberately NOT generated here so no credentials live in Git).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: catalog

resources:
  - ../../base/app
  - ingress.yaml

configMapGenerator:
  - name: product-catalog-config
    behavior: merge
    literals:
      - DB_URL=jdbc:postgresql://CHANGE_ME.postgres.database.azure.com:5432/catalog?sslmode=require
      - DB_POOL_SIZE=15
      - SEED_DATA=false
      - LOG_LEVEL=INFO

# The pipeline sets newTag (and newName if you use another registry).
images:
  - name: product-catalog-ws
    newName: CHANGE_ME.azurecr.io/product-catalog-ws
    newTag: CHANGE_ME

patches:
  - target:
      kind: HorizontalPodAutoscaler
      name: product-catalog
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 10
  - target:
      kind: Deployment
      name: product-catalog
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/topologySpreadConstraints/0/whenUnsatisfiable
        value: DoNotSchedule
