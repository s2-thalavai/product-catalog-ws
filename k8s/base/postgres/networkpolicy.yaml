# Only the catalog API pods may connect to PostgreSQL (k3s enforces NetworkPolicy out of the box).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: product-catalog-postgres
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: product-catalog-postgres
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: product-catalog
      ports:
        - protocol: TCP
          port: 5432
